<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Line Simulator</title>
    <style>
        /* MATCHING YOUR HOMEPAGE THEME */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.1s;
        }

        h1 { font-size: 2.5em; color: #333; margin-bottom: 10px; text-align: center; }
        .subtitle { color: #555; margin-bottom: 40px; font-size: 1.1em; }

        .machine-cabinet {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 60px 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* SPEECH BUBBLE */
        .speech-bubble {
            position: absolute;
            top: -40px;
            background: #fff;
            border: 3px solid #333;
            border-radius: 20px;
            padding: 15px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: #333 transparent;
            display: block;
            width: 0;
        }
        .speech-bubble.active { opacity: 1; transform: scale(1) translateY(-20px); }

        /* THE PHONE */
        #phone-container {
            width: 200px;
            cursor: pointer;
            position: relative;
        }

        /* RINGING ANIMATION (Passive) */
        @keyframes ring {
            0% { transform: rotate(0) scale(1); }
            5% { transform: rotate(3deg) scale(1.02); }
            10% { transform: rotate(-3deg) scale(1.02); }
            15% { transform: rotate(3deg) scale(1.02); }
            20% { transform: rotate(0) scale(1); }
            100% { transform: rotate(0) scale(1); }
        }
        .ringing { animation: ring 1s infinite; }

        .handset {
            transition: transform 0.3s ease-in-out;
            transform-origin: center;
        }
        .picked-up .handset {
            transform: translateY(-80px) rotate(-15deg);
        }

        /* ANGRY EFFECTS */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(3px, 2px) rotate(1deg); }
            60% { transform: translate(1px, -1px) rotate(1deg); }
            80% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 2px) rotate(0deg); }
        }
        .angry-mode { background-color: #ff0000 !important; animation: shake 0.1s infinite; }

        .back-link { margin-top: 30px; color: #555; text-decoration: none; font-size: 0.9em; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Support Line Simulator</h1>
    <p class="subtitle">Will it be a quick fix or a total meltdown?</p>

    <div class="machine-cabinet" id="cabinet">
        <div id="bubble" class="speech-bubble">🙂</div>

        <div id="phone-container" class="ringing" onclick="answerPhone()">
            <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
                <rect x="40" y="80" width="120" height="50" rx="10" fill="#333" />
                <path d="M50 80 Q100 60 150 80" fill="#444" />
                <path d="M40 100 Q10 110 30 130 T 10 150" fill="none" stroke="#222" stroke-width="4" />
                <circle cx="100" cy="105" r="20" fill="#eee" />
                <circle cx="100" cy="105" r="15" fill="none" stroke="#999" stroke-dasharray="2,2" />
                <g class="handset" id="handset">
                    <rect x="30" y="40" width="140" height="25" rx="12" fill="#222" />
                    <rect x="30" y="45" width="40" height="30" rx="5" fill="#222" />
                    <rect x="130" y="45" width="40" height="30" rx="5" fill="#222" />
                </g>
            </svg>
        </div>
        
        <p id="instruction" style="color: #999; margin-top: 20px; font-size: 0.8em;">CLICK TO ANSWER</p>
    </div>

    <a href="index.html" class="back-link">← Back to Toolbox</a>

    <script>
        const outcomes = [
            { emoji: '🙂', type: 'normal' },
            { emoji: '😕', type: 'normal' },
            { emoji: '🤖', type: 'normal' },
            { emoji: '🤬', type: 'angry' }
        ];

        let isBusy = false;

        function answerPhone() {
            if (isBusy) return;
            isBusy = true;

            const phone = document.getElementById('phone-container');
            const bubble = document.getElementById('bubble');
            const body = document.body;
            const instruction = document.getElementById('instruction');

            // 1. Stop ringing and "Pick up"
            phone.classList.remove('ringing');
            phone.classList.add('picked-up');
            instruction.style.opacity = '0';

            // 2. Select outcome
            const result = outcomes[Math.floor(Math.random() * outcomes.length)];
            
            // 3. Apply effects
            setTimeout(() => {
                bubble.innerText = result.emoji;
                bubble.classList.add('active');

                if (result.type === 'angry') {
                    body.classList.add('angry-mode');
                }
            }, 200);

            // 4. Reset after 3 seconds
            setTimeout(() => {
                bubble.classList.remove('active');
                body.classList.remove('angry-mode');
                phone.classList.remove('picked-up');
                
                setTimeout(() => {
                    phone.classList.add('ringing');
                    instruction.style.opacity = '1';
                    isBusy = false;
                }, 500);
            }, 3000);
        }
    </script>
</body>
</html>
