<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blame Game - Lightspeed Edition</title>
    <style>
        /* Your existing styles plus some for the close button */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f4f9; }
        .container { margin-top: 50px; }
        #wheel { width: 300px; height: 300px; border-radius: 50%; border: 5px solid #333; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem; background: #fff; transition: transform 2s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        
        /* The Button to close the Lightspeed Modal */
        .exit-btn {
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #e51937; /* Lightspeed Red */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: none; /* Hidden until we know we are in an iframe */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Blame Game</h1>
        <div id="wheel">?</div>
        <button onclick="spinWheel()">Click to Spin!</button>
        
        <br>
        <button id="lightspeedExit" class="exit-btn" onclick="closeLightspeedModal()">Finish & Close</button>
    </div>

    <script>
        // 1. CAPTURE THE ORIGIN
        // Lightspeed appends ?origin=yourstore.retail.lightspeed.app to the URL
        const urlParams = new URLSearchParams(window.location.search);
        const lsOrigin = urlParams.get('origin');

        // Show the exit button only if we detect we are inside Lightspeed
        if (lsOrigin) {
            document.getElementById('lightspeedExit').style.display = 'inline-block';
        }

        // Your existing Spin Logic
        function spinWheel() {
            const options = ["The Developer", "The Internet", "Mercury Retrograde", "Cache Issues", "The User"];
            const choice = options[Math.floor(Math.random() * options.length)];
            const wheel = document.getElementById('wheel');
            wheel.style.transform = "rotate(" + (Math.random() * 360 + 1440) + "deg)";
            setTimeout(() => {
                wheel.innerText = choice;
            }, 2000);
        }

        // 2. THE LIGHTSPEED CLOSE FUNCTION
        function closeLightspeedModal() {
            if (!lsOrigin) {
                alert("Not running inside Lightspeed. Use the 'origin' URL parameter to test.");
                return;
            }

            // Lightspeed expects a JSON string with a 'step'
            const payload = JSON.stringify({
                step: "EXIT"
            });

            // 3. SEND THE POSTMESSAGE
            // We target the parent window and provide the secure origin
            window.parent.postMessage(payload, `https://${lsOrigin}`);
        }
    </script>
</body>
</html>
